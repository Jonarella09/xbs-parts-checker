<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Indexer</title>
<meta name="description" content="Count and index parts: projects, kits, photo counting, package labels and print plates. Works in your browser.">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app" class="app" aria-live="off">
  <div class="boot"><div class="boot-star" aria-hidden="true"></div><p>Loading The Indexer…</p></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="modalRoot"></div>
<input type="file" id="starIn" accept=".star,application/x-indexer-star,application/zip" hidden>
<div class="dropzone" id="dropzone" hidden><span id="dropText">Drop it here</span></div>
<noscript><p style="padding:24px">The Indexer needs JavaScript turned on.</p></noscript>
</body>
</html>
